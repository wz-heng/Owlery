<!-- The Owlery mark: the wax seal, with the owl impressed into it.
     Geometry is generated from web/src/lib/seal.ts (13 lobes, r=13.4/16.4 on
     a 32 grid) — the SAME rim the app stamps on every bubble, card and
     dialog, and the same path baked into --seal-rim in tokens.css. Redraw it
     there, not here.
     The face is painted parchment rather than punched to transparent: a
     favicon lands on a browser tab of unknown colour, and holes that show
     through would let the owl vanish on a warm one.
     #8C5A0D = hsl(36 82% 30%) (primary-700); #FBF8F1 = the parchment. -->
