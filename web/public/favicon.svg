  <path fill="#FBF8F1" fill-rule="evenodd" clip-rule="evenodd" d="M8.16 14.13a3.34 3.34 0 1 0 6.68 0a3.34 3.34 0 1 0 -6.68 0ZM17.17 14.13a3.34 3.34 0 1 0 6.68 0a3.34 3.34 0 1 0 -6.68 0ZM14.04 17.20L17.96 17.20L16.00 21.76Z"/>
