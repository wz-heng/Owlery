[project]
name = "owlery"
version = "0.1.0"
description = "Remote Claude Code controller"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10",
    # Pinned below 2.0: the whole server imports FastMCP via the 1.x path
    # `mcp.server.fastmcp` (server/mcp_servers/*.py), which the 2.0 SDK moved.
    # `>=1.0` alone now resolves to 2.0.0 and breaks every in-app MCP server —
    # keep the floor but cap the major until a deliberate v2 import migration.
    "mcp>=1.0,<2",
    # Feishu bridge (docs/plans/feishu-bridge.md). Pinned: the SDK's lifecycle
    # + strict-security surface is what we depend on; a float could swap it.
    "lark-channel-sdk==1.2.0",
    # Agent memory frontmatter parsing (docs/plans/memory-ui.md). Already
    # pulled in transitively by uvicorn[standard]; pinned explicitly since
    # server/routers/memory.py imports it directly.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Fake IMAP/SMTP test servers for the `mail` connector
    # (mail-connector.md §4.5) — real TLS/STARTTLS handshakes against a
    # throwaway self-signed cert, no real mailbox involved.
    "aiosmtpd>=1.4",
    "cryptography>=42",
]

[project.scripts]
owlery = "server.cli:main"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
